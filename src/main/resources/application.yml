server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/warthunderdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 自动创建/更新表结构
    show-sql: true # 控制台显示SQL
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# JWT密钥
app:
  jwt:
    secret: war-thunder-vehicle-management-secret-key-must-be-long-enough
    expiration-ms: 86400000 # 24小时
